name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0E2620'
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace > ../build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -n -A14 "What went wrong" ../build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GradleError::$msg"
            msg2=$(grep -n -m8 -E "error:|Caused by|Execution failed" ../build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GradleLines::$msg2"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Daawo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
